name: Release

on:
  #A "vX.Y.Z" tag cuts a release. Tags are normally created for you by `gh release create` (see the
  #"Create release" step below): the tag is pushed with *your* token, so it triggers this workflow,
  #whereas a tag created by a workflow's own GITHUB_TOKEN would not.
  #
  #A merge to master runs the same build pipeline, and that run is what keeps the Gradle caches warm.
  #GitHub scopes caches per ref: one written by a pull_request run is scoped to refs/pull/<n>/merge
  #and, in GitHub's words, "can only be restored by re-runs of the pull request... cannot be restored
  #by the base branch". Caches written in the default branch's scope *are* restored by PR and tag
  #runs alike. A master push never publishes anything: only a tag ref does.
  push:
    branches:
      - master
    tags:
      - 'v*'
  #Every PR runs the exact same build pipeline (minus signing/publishing) so a broken build or a bad
  #version can never reach a release tag.
  pull_request:
  #Plain "just build it" runs (never publishes). Dispatching from master also refreshes the cache.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      #Fork PRs get no secrets, so the signing step below no-ops and the APKs come out unsigned.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          #full history + tags so `git describe --tags` can resolve the version on untagged builds
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          version=""
          prerelease=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            #tag push: the tag is the version
            version="${GITHUB_REF_NAME#v}"
            #a version with a suffix (v2.2.0-rc.1) is a pre-release
            if [[ "$version" == *-* ]]; then prerelease=true; fi
          fi
          #left empty for PR/master/manual builds, so Gradle derives a dev version from git tags
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version='$version' prerelease=$prerelease ref=${GITHUB_REF_NAME}"

      - name: Validate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a vX.Y.Z version"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      #Caching Gradle User Home (the wrapper distribution, the Java toolchains and the resolved
      #dependencies, GeckoView included) is what makes repeated builds cheaper. The action's
      #read-only-outside-the-default-branch default is exactly right here: the master push above
      #writes the cache, everything else only reads it, so the repository's cache budget is spent
      #on one useful entry instead of one per PR.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable release signing
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "No keystore secret available (e.g. a fork PR); building unsigned release APKs."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build GeckoIncluded
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew assembleP403n1x87GeckoIncludedRelease -PenableAbiSplits ${VERSION_NAME:+-PversionName=$VERSION_NAME}

      - name: Build GeckoExcluded
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew assembleP403n1x87GeckoExcludedRelease ${VERSION_NAME:+-PversionName=$VERSION_NAME}

      - name: Verify release APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt=$(ls "$sdk"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          if [[ -z "$aapt" ]]; then
            echo "::error::aapt not found under '$sdk' — cannot verify the APK version"
            exit 1
          fi
          for apk in app/build/outputs/apk/p403n1x87*/release/*.apk; do
            badging=$("$aapt" dump badging "$apk" | head -1)
            echo "$apk -> $badging"
            if ! grep -qF "versionName='${{ steps.version.outputs.version }}'" <<< "$badging"; then
              echo "::error::$apk does not carry versionName ${{ steps.version.outputs.version }}"
              exit 1
            fi
            #AGP names a release APK built without a signing config "*-unsigned.apk": the in-app
            #updater could not map such a name to an ABI (it looks for "*-<abi>.apk"), and an
            #unsigned APK is unusable anyway, so fail instead of publishing one.
            if [[ "$apk" == *-unsigned.apk ]]; then
              echo "::error::$apk is unsigned — are the KEYSTORE_* secrets configured?"
              exit 1
            fi
          done

      - name: Rename artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for dir in p403n1x87GeckoIncluded p403n1x87GeckoExcluded; do
            for f in app/build/outputs/apk/${dir}/release/app-*.apk; do
              new="${f/app-/tvbro-${{ steps.version.outputs.version }}-}"
              new="${new/-release-unsigned.apk/.apk}"
              new="${new/-release.apk/.apk}"
              mv "$f" "$new"
            done
          done

      #Only for builds that are not published: on a release run the same APKs are attached to the
      #release, so uploading a 250+ MB artifact a second time would just waste time and storage.
      - name: Upload APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tvbro-${{ steps.version.outputs.version || github.run_number }}
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      #The tag already exists (pushed by `gh release create` or by hand), so this looks the release up
      #by tag — drafts included, which the getReleaseByTag API does not return, hence the listing
      #fallback in the action — replaces its body with RELEASE_NOTES.md and attaches the APKs,
      #replacing same-named assets. A release created published (`gh release create vX.Y.Z --target
      #master`) is complete once this step ends; one created as a draft (`--draft`) is published here
      #because `draft` is not passed.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          #A glob that matches nothing would otherwise publish an empty release and still go green.
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/p403n1x87GeckoIncluded/release/*.apk
            app/build/outputs/apk/p403n1x87GeckoExcluded/release/*.apk
